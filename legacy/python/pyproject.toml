[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-claw"
version = "0.1.0"
description = "Multi-source article fetcher (WeChat, blogs, …) that converts web articles to clean Markdown"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "jackwener" }
]
dependencies = [
  "camoufox[geoip]",
  "markdownify",
  "beautifulsoup4",
  "httpx[socks]",
  "readability-lxml",
]
keywords = ["wechat", "blog", "markdown", "crawler", "camoufox", "sitemap"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/jackwener/wechat-article-to-markdown"
Issues = "https://github.com/jackwener/wechat-article-to-markdown/issues"

[project.scripts]
spider-claw = "spider_claw:main"

[tool.setuptools]
packages = ["spider_claw", "spider_claw.core", "spider_claw.sources"]

[tool.pytest.ini_options]
markers = [
  "e2e: live end-to-end tests that require network and browser runtime",
]
